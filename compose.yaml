services:
  web:
    build: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-4177}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    command: ["sh", "-c", "python -m app.migrate up && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql://pipeline:${POSTGRES_PASSWORD:-dev-only-change-me}@db:5432/pipeline
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: ./backend
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "--name", "pipeline-worker", "default"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pipeline:${POSTGRES_PASSWORD:-dev-only-change-me}@db:5432/pipeline
      REDIS_URL: redis://redis:6379/0
      ANTIGRAVITY_SETTINGS_PATH: /run/antigravity/settings.json
    healthcheck:
      test: ["CMD", "python", "-c", "from redis import Redis; from rq import Worker; assert any(w.name == 'pipeline-worker' for w in Worker.all(connection=Redis.from_url('redis://redis:6379/0')))"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pipeline
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  redis_data:
